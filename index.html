<!doctype html>
<html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>칼라미티 인페르넘 1~3부 장비·획득 통합 공략집</title><style>body{background:#0b1120;color:#eff5ff;font:16px system-ui,sans-serif;margin:0;min-height:100vh;display:grid;place-items:center}main{text-align:center;padding:24px}button{padding:10px 18px;border-radius:8px;cursor:pointer}</style></head><body><main><p id="status" role="status">공략집을 불러오는 중입니다…</p><button hidden id="retry" onclick="location.reload()">다시 시도</button><noscript>공략집을 열려면 JavaScript를 활성화해 주세요.</noscript></main><script>
(async()=>{try{const paths=["guide-data/fb44f97c/part-01.txt","guide-data/fb44f97c/part-02.txt","guide-data/fb44f97c/part-03.txt","guide-data/fb44f97c/part-04.txt","guide-data/fb44f97c/part-05.txt","guide-data/fb44f97c/part-06.txt","guide-data/fb44f97c/part-07.txt","guide-data/fb44f97c/part-08.txt","guide-data/fb44f97c/part-09.txt","guide-data/fb44f97c/part-10.txt","guide-data/fb44f97c/part-11.txt","guide-data/fb44f97c/part-12.txt","guide-data/fb44f97c/part-13.txt","guide-data/fb44f97c/part-14.txt","guide-data/fb44f97c/part-15.txt","guide-data/fb44f97c/part-16.txt"];const parts=await Promise.all(paths.map(async path=>{const r=await fetch(path);if(!r.ok)throw new Error(path+": "+r.status);return r.text()}));const html=parts.join("");if(html.length!==3862180||new TextEncoder().encode(html).length!==4067839)throw new Error("Incomplete guide");document.open();document.write(html);document.close();}catch(e){console.error(e);document.getElementById("status").textContent="공략집을 불러오지 못했습니다.";document.getElementById("retry").hidden=false;}})();
